name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PostgreSQL and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 ffmpeg python3-pil
      - name: Build gateway
        run: bash scripts/build-gateway.sh
      - name: Render reference fixture
        run: /usr/bin/python3 production-pilot/render.py
      - name: Verify
        run: bash scripts/test.sh
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
      - name: Compile native Android Companion
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          ./gradlew --no-daemon :android-app:assembleDebug
