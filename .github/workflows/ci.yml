name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PostgreSQL and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 ffmpeg python3-pil
      - name: Build gateway
        run: bash scripts/build-gateway.sh
      - name: Render reference fixture
        run: /usr/bin/python3 production-pilot/render.py
      - name: Verify
        run: bash scripts/test.sh
