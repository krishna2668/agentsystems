name: Gateway candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 ffmpeg python3-pil
      - run: bash scripts/build-gateway.sh
      - run: /usr/bin/python3 production-pilot/render.py
      - run: bash scripts/test.sh
  upload:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: gateway-candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Configure isolated release checkout
        env:
          GATEWAY_ORIGIN: ${{ secrets.GATEWAY_ORIGIN }}
          SUPABASE_ORIGIN: ${{ secrets.SUPABASE_ORIGIN }}
        run: |
          test -n "$GATEWAY_ORIGIN" && test -n "$SUPABASE_ORIGIN"
          python3 scripts/configure-deployment.py --gateway "$GATEWAY_ORIGIN" --supabase "$SUPABASE_ORIGIN"
      - run: bash scripts/build-gateway.sh
      - name: Upload immutable Cloudflare candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-candidate.mjs
